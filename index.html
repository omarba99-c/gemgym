<title>30-Day Gym Challenge</title>
<style>

main{padding:24px clamp(14px,3vw,36px);max-width:1180px}

.ex{margin-bottom:14px}.ex.act{border-color:var(--ac);box-shadow:0 0 0 2px rgba(182,242,58,.3)}.ex.fin{border-color:var(--ok)}

.nonav #nav{display:none}.nonav main{margin-left:0;padding-bottom:24px}.fig3{display:flex;gap:6px;justify-content:space-around;text-align:center}.fig3 svg{width:90px;height:170px}.fig3>div{flex:1}.inl label{color:var(--tx2);font-size:13px}

 <details><summary>How We Calculated Your Needs</summary><p>BMR (Mifflin-St Jeor) = 10 x ${q.w.toFixed(1)} kg + 6.25 x ${q.h.toFixed(0)} cm - 5 x ${q.age} ${q.sex==="m"?"+ 5":"- 161"} = <b>${c.bmr} kcal</b>.</p><p>TDEE = BMR x activity multiplier ${c.mul} = <b>${c.tdee} kcal</b>.</p><p>Target = TDEE adjusted for your goal (${GL[q.goal]}): about -20% for fat loss, -12% for fat loss with muscle preservation, +8% for muscle building, +5% for strength, and maintenance otherwise. It is never set below BMR automatically.</p><p>Protein: ${q.goal==="fatloss"||q.goal==="recomp"||q.goal==="muscle"?"2.0":"1.6"} g per kg of body weight (based on your target weight when losing fat). Fat: about 27% of calories. Carbs: the remainder. Fiber: 14 g per 1,000 kcal. Water: about 35 ml per kg, adjusted for heat, sweat and medical advice.</p></details>

 <h2>Sample day</h2><div class="grid g3">${MEALS.map(a=>`<div class="card"><h3>${a[0]}</h3><div class="sub">about ${Math.round(c.t*a[1]/10)*10} kcal | ${Math.round(c.pr*a[1])} g protein</div><p>${esc(a[2])}</p></div>`).join("")}</div><p class="sub">Portions shown suit a mid-sized meal. Scale up or down to the kcal figure. Substitutions: no meat? use eggs, lentils, tofu, yogurt or cheese. No dairy? use soy products or hummus. Swap staples for what you can buy and enjoy.</p>
 <h2>Protein, hydration and education</h2><div class="card">${secList(tips)}</div><button class="btn ghost" id="editprof" style="margin:14px 0">Edit my profile</button>`}
function nut(){return persoNut()+nutGen()}
/* body illustration + dashboard */
function bodySvg(w,lab,sm){const p=S.profile,b=w/Math.pow(p.h/100,2),s=Math.min(1.5,Math.max(.62,.62+(b-17)*.045)),W=22*s;
 return`<div><svg viewBox="0 0 100 190" role="img" aria-label="${lab} silhouette" style="${sm?"width:56px;height:106px":""}"><circle cx="50" cy="16" r="11" fill="var(--ac2)"/><ellipse cx="50" cy="70" rx="${W}" ry="34" fill="var(--ac2)"/><ellipse cx="50" cy="86" rx="${W*(.9+(s-.62)*.25)}" ry="22" fill="var(--ac2)"/><rect x="${50-W-9*s}" y="42" width="${9*s}" height="58" rx="${4*s}" fill="var(--ac)"/><rect x="${50+W}" y="42" width="${9*s}" height="58" rx="${4*s}" fill="var(--ac)"/><rect x="${50-13*s}" y="112" width="${12*s}" height="70" rx="${5*s}" fill="var(--ac)"/><rect x="${50+s}" y="112" width="${12*s}" height="70" rx="${5*s}" fill="var(--ac)"/></svg><b>${lab}</b><br>${(w*KG()).toFixed(1)} ${WU()}</div>`}
function msg(){const s=stats(),m=wlist(),p=S.profile,o=[];if(!s.days)return"Day 1 is waiting. Start with the warm-up and focus on technique.";
 o.push(s.days<7?s.days+" day"+(s.days>1?"s":"")+" completed. Keep building consistency.":s.days<14?"You've completed your first week. Keep building consistency.":s.days+" days done. Your habit is taking shape.");
 if(m.length>=3&&p.gw){const a=m[0].w,b=m[m.length-1].w;if((p.gw<a&&b<a)||(p.gw>a&&b>a))o.push("Your weight trend is moving toward your goal.")}
 const rc=DAYS.filter((D,i)=>"RX".includes(D[1])&&reqDone(i+1)).length;if(rc)o.push("Recovery is part of progress: "+rc+" recovery day"+(rc>1?"s":"")+" done.");return o.join(" ")}
function bodyCard(){const p=S.profile;if(!p)return"";const c=tg(p),m=wlist(),st=m[0]?m[0].w:p.w,now=m.length?m[m.length-1].w:p.w,d=now-st,s=stats(),U=v=>(v*KG()).toFixed(1)+" "+WU();
 const pick=m.length>6?[0,1,2,3,4,5].map(i=>m[Math.round(i*(m.length-1)/5)]):m;
 return`<div class="card" style="margin-top:14px"><h3>${esc(p.name||"Athlete")}</h3><div>${[p.age+" years",(S.set.units==="imperial"?(p.h/2.54).toFixed(1)+" in":p.h.toFixed(0)+" cm"),"now "+U(now),p.gw?"target "+U(p.gw):"no target set",GL[norm(p).goal],s.days+"/30 days, "+(30-s.days)+" remaining"].map(x=>`<span class="tag">${x}</span>`).join("")}</div><p>${esc(msg())}</p><div class="sub">Nutrition: maintenance ${c.tdee} kcal | target ${c.t} kcal | protein ${c.pr} g <button class="chip" data-go="nut">Nutrition plan</button></div></div>
 <h2>YOUR BODY TRANSFORMATION</h2><div class="card"><div class="fig3">${bodySvg(st,"Start")}${bodySvg(now,"Current")}${p.gw?bodySvg(p.gw,"Target"):""}</div><p><b>${d>0?"+":""}${U(d)} (${(d/st*100).toFixed(1)}%)</b> since your first weigh-in.</p>${pick.length>1?`<div class="fig3" style="margin-top:8px">${pick.map(x=>`<div>${bodySvg(x.w,x.date.slice(5),1)}</div>`).join("")}</div><p class="sub">Timeline of your logged weights.</p>`:""}<p class="sub">This is a symbolic illustration scaled from height and weight only. It is not a photo, a body-fat estimate or a prediction of how you will look, and it cannot show where fat or muscle changed.</p></div>
 <h2>Weight tracking</h2><div class="card">${logForm()}${chart()}<div>${wrows(m).split("</div>").slice(0,3).join("</div>")}${m.length?"</div>":""}</div><button class="chip" data-go="prog">All entries and measurements</button></div>`}
function R(){if(!S.profile)view="onb";document.body.classList.toggle("nonav",view==="onb");$("#nav").innerHTML='<div class="logo">30-DAY GYM</div>'+NAV.map(n=>`<button data-go="${n[0]}" class="${view===n[0]||(view==="day"&&n[0]==="plan")?"on":""}" ${view===n[0]?'aria-current="page"':""}><span aria-hidden="true">${n[1]}</span>${n[2]}</button>`).join("");
 document.documentElement.dataset.theme=S.set.theme;document.body.classList.toggle("noanim",!!S.set.reduce);
 $("#main").innerHTML={dash,plan,day:dayView,lib:libView,prog,nut,set:setView,onb}[view]()}
/* ---------- events ---------- */
function after(d){if(reqDone(d)&&!S.cel[d]){S.cel[d]=1;save();beep(880);toast("Day "+d+" complete! 🎉");
  if(nDone()===30)modal('<h2>🏆 30-Day Challenge Complete!</h2><p>You finished all 30 days. Review your stats, then plan your next block with a little more weight or one extra set.</p><button class="btn" data-close>Close</button>');
  else if(d%7===0||d===30)toast("Week finished. Nice consistency!")}
 else if(!reqDone(d)&&S.cel[d]){delete S.cel[d];save()}}
function modal(h){const m=$("#modal");m.innerHTML='<div class="card">'+h+'</div>';m.classList.add("on")}
document.addEventListener("click",e=>{const t=e.target.closest("button,input,[data-day]");if(!t)return;
 if(t.dataset.close!==undefined||t.id==="cancel"){$("#modal").classList.remove("on");return}
 if(t.dataset.day){curDay=+t.dataset.day;go("day",curDay)}
 else if(t.dataset.go)go(t.dataset.go);
 else if(t.dataset.obgo!==undefined||t.id==="obnext"){document.querySelectorAll("[data-ob]").forEach(x=>{ob.d[x.dataset.ob]=x.value});
  if(t.dataset.obgo!==undefined){ob.s=Math.max(0,ob.s+(+t.dataset.obgo));R();return}
  const er=chkOb();if(er){toast(er);return}
  if(ob.s<STEPS.length){ob.s++;R();window.scrollTo(0,0)}else finishOb()}
 else if(t.id==="editprof"){ob=null;go("onb")}
 else if(t.id==="savetg"){const g=i=>Math.round(parseFloat($("#"+i).value))||0,m={t:g("mt"),pr:g("mp"),carb:g("mc"),fat:g("mf")};if(m.t&&m.t<1000){toast("Calories below 1000 are not allowed here");return}S.manual=m;save();toast("Targets saved");R()}
 else if(t.id==="rsttg"){S.manual=null;save();R()}
 else if(t.id==="addw"){const w=parseFloat($("#wv").value)/KG(),d=$("#wd").value;if(!(w>=30&&w<=400)||!d){toast("Enter a valid date and weight");return}
  S.meas.push({date:d,time:$("#wt").value,w,note:$("#wn").value.trim().slice(0,120),c:0});save();beep(700);toast("Weight logged");R()}
 else if(t.dataset.edm!==undefined){const m=S.meas[+t.dataset.edm];modal(`<h2>Edit entry</h2><div class="inl"><label>Date<input type="date" id="ed" value="${m.date}"></label><label>Time<input type="time" id="et" value="${m.time||""}"></label><label>Weight (${WU()})<input type="number" step="0.1" id="ew" value="${(m.w*KG()).toFixed(1)}"></label></div><br><label>Note<input type="text" id="en" maxlength="120" value="${esc(m.note||"")}"></label><br><div class="inl"><button class="btn ghost" data-close>Cancel</button><button class="btn" data-svm="${t.dataset.edm}">Save</button></div>`)}
 else if(t.dataset.svm!==undefined){const m=S.meas[+t.dataset.svm],w=parseFloat($("#ew").value)/KG();if(!(w>=30&&w<=400)||!$("#ed").value){toast("Enter a valid date and weight");return}m.date=$("#ed").value;m.time=$("#et").value;m.w=w;m.note=$("#en").value.trim().slice(0,120);save();$("#modal").classList.remove("on");R()}
 else if(t.dataset.delm!==undefined)modal(`<h2>Delete this entry?</h2><p>This removes the weight entry permanently.</p><div class="inl"><button class="btn ghost" data-close>Cancel</button><button class="btn red" data-cdel="${t.dataset.delm}">Delete</button></div>`);
 else if(t.dataset.cdel!==undefined){S.meas.splice(+t.dataset.cdel,1);save();$("#modal").classList.remove("on");R()}
 else if(t.id==="savebm"){const o={date:today()};let any=0;["waist","chest","hip","arm","thigh"].forEach(k=>{const v=parseFloat($("#b-"+k).value);if(v>0){o[k]=v*(S.set.units==="imperial"?2.54:1);any=1}});if(!any){toast("Enter at least one measurement");return}S.bm.push(o);save();toast("Measurements saved");R()}
 else if(t.dataset.f){filt=t.dataset.f;R()}
 else if(t.id==="addm"){const w=parseFloat($("#mw").value),c=parseFloat($("#mc").value);if(!w&&!c){toast("Enter a weight or waist value");return}
  S.meas.push({date:new Date().toISOString().slice(0,10),w:w?w/KG():0,c:c?(S.set.units==="imperial"?c*2.54:c):0});save();toast("Measurement saved");R()}
 else if(t.id==="reset")modal('<h2>Reset all progress?</h2><p>This permanently deletes all completed days, weights, notes, measurements and settings on this browser.</p><div class="inl"><button class="btn ghost" id="cancel">Cancel</button><button class="btn red" id="confirm">Yes, reset everything</button></div>');
 else if(t.id==="confirm"){try{localStorage.removeItem(KEY)}catch(x){}location.hash="";location.reload()}
 else if(t.dataset.t){const[d,k]=t.dataset.t.split(":");S.tasks[t.dataset.t]=t.checked;
  if(k[0]==="e"&&k.length<3){const i=k.slice(1);for(let j=0;j<SETS(+d);j++)S.sets[d+":"+i+":"+j]=t.checked}
  save();beep(t.checked?700:400);R();after(+d)}
 else if(t.dataset.s){const p=t.dataset.s.split(":"),d=+p[0],i=p[1];S.sets[t.dataset.s]=t.checked;let all=true;for(let j=0;j<SETS(d);j++)if(!S.sets[d+":"+i+":"+j])all=false;S.tasks[tk(d,"e"+i)]=all;save();beep(600);R();after(d)}
 else if(t.dataset.set){S.set[t.dataset.set]=t.checked;save();R()}});
document.addEventListener("change",e=>{const t=e.target,d=curDay;
 if(t.dataset.fat!==undefined){S.fat[t.dataset.fat]=t.value;save();R()}else if(t.dataset.w!==undefined){const v=parseFloat(t.value);if(isNaN(v))delete S.w[t.dataset.w];else S.w[t.dataset.w]=v/KG();save()}
 else if(t.dataset.r!==undefined){S.r[t.dataset.r]=t.value;save()}
 else if(t.dataset.n!==undefined){S.n[t.dataset.n]=t.value;save()}
 else if(t.dataset.sv){S.set[t.dataset.sv]=t.value;save();R()}
 else if(t.dataset.l){lib[t.dataset.l]=t.value;R()}});
document.addEventListener("input",e=>{if(e.target.id==="lq"){lib.q=e.target.value;const p=e.target.selectionStart;R();const q=$("#lq");q.focus();q.setSelectionRange(p,p)}});
document.addEventListener("toggle",e=>{if(e.target.dataset&&e.target.dataset.o)open[e.target.dataset.o]=e.target.open},true);
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(/^day\d+$/.test(h)){curDay=Math.min(30,Math.max(1,+h.slice(3)));view="day"}else if(NAV.some(n=>n[0]===h))view=h;R()});
(function init(){const h=location.hash.slice(1);if(/^day\d+$/.test(h)){curDay=Math.min(30,Math.max(1,+h.slice(3)));view="day"}else if(NAV.some(n=>n[0]===h))view=h;R()})();
</script></body></html>
